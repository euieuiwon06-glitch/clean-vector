<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clean Vector</title>
  <meta name="description" content="PNG를 깨끗한 패스의 SVG로. 수평·수직 직선, 정확한 코너와 원호, 매끈한 곡선." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M8 23V9h7a7 7 0 0 1 0 14' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='8' cy='23' r='2.6' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="styles.css?v=ae7e2850" />
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" /><path d="M8 23V9h7a7 7 0 0 1 0 14" /><circle cx="8" cy="23" r="2.6" /></svg>
      <span>Clean Vector</span>
    </div>
    <div class="seg mode" id="mode" role="tablist" aria-label="변환 방식">
      <button data-v="auto" class="on" title="이미지를 보고 알아서 고릅니다">자동</button>
      <button data-v="graphic" title="로고·일러스트·선화 등 전체를 벡터로">그래픽만</button>
      <button data-v="overlay" title="사진은 원본 그대로, 위에 얹힌 색 그래픽만 벡터로">사진+그래픽</button>
    </div>
    <div class="bar-actions">
      <label class="btn ghost" for="file" id="openBtn">이미지 열기<input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden /></label>
      <button class="btn ghost" id="copy" disabled>SVG 복사</button>
      <button class="btn primary" id="save" disabled>SVG 저장</button>
    </div>
  </header>

  <main class="layout">
    <aside class="side" aria-label="보기">
      <p class="side-label">보기</p>
      <div class="vseg" id="view" role="tablist" aria-orientation="vertical">
        <button data-v="orig"><kbd>1</kbd>원본</button>
        <button data-v="vec" class="on"><kbd>2</kbd>결과</button>
        <button data-v="wipe"><kbd>3</kbd>비교</button>
        <button data-v="path"><kbd>4</kbd>패스</button>
      </div>
      <div class="status" id="status"></div>
    </aside>
    <section class="stage-wrap">
      <div class="stage" id="stage">
        <div class="world" id="world">
          <div id="vec"></div>
          <div id="outline"></div>
        </div>
        <canvas id="anchors"></canvas>
        <div class="wipe" id="wipe" hidden><span></span></div>
        <div class="drop" id="drop">
          <div>
            <strong>PNG를 끌어다 놓으세요</strong>
            <span>또는 붙여넣기(Ctrl+V) · 이미지 열기<br/>넣으면 바로 깨끗한 SVG로 바뀝니다</span>
          </div>
        </div>
        <div class="progress" id="progress"><i></i></div>
      </div>
      <div class="footbar">
        <div class="stats" id="stats"></div>
        <div class="zoom">
          <button class="icon" id="zoomOut" aria-label="축소">−</button>
          <button class="zv" id="zoomFit" title="화면에 맞춤">100%</button>
          <button class="icon" id="zoomIn" aria-label="확대">+</button>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="src/app.js?v=ae7e2850"></script>
</body>
</html>
